<head>
<meta charset="UTF-8">

<title>Conversation wheel · easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e0e12;
    --text: #f5f3ef;
    --muted: #8a8a96;
    --accent: #ffb86b;
    --accent-2: #ff7a59;
    --accent-3: #6be0c9;
    --line: rgba(255,255,255,0.08);
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    letter-spacing: -0.58px;
    overflow: hidden;
  }

  body::before{
    content:"";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 0%, rgba(255,184,107,0.10), transparent 60%),
      radial-gradient(ellipse 50% 50% at 90% 100%, rgba(107,224,201,0.08), transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(255,122,89,0.05), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .hero{
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    padding: 20px clamp(24px, 6vw, 96px) 12px;
    padding-top: max(20px, env(safe-area-inset-top));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .eyebrow{
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.9;
  }

  h1{
    font-size: clamp(28px, 4.2vw, 48px);
    font-weight: 700;
    letter-spacing: -1.6px;
    line-height: 1.05;
    max-width: 14ch;
  }
  h1 span{
    background: linear-gradient(100deg, var(--accent), var(--accent-2) 60%, var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lead{
    font-size: clamp(13px, 1.3vw, 16px);
    color: var(--muted);
    line-height: 1.6;
    max-width: 56ch;
    font-weight: 400;
  }

  .actions-row{
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    width: 100%;
    margin-top: 4px;
  }

  .step{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(255,255,255,0.015);
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .step:hover{
    border-color: rgba(255,184,107,0.35);
    background: rgba(255,184,107,0.04);
  }

  .step-icon{
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: rgba(255,184,107,0.10);
    border: 1px solid rgba(255,184,107,0.30);
    color: var(--accent);
  }
  .step-icon svg{ width: 18px; height: 18px; }

  .step-title{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
    white-space: nowrap;
  }

  .cta{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 54px;
    padding: 0 22px;
    font-family: inherit;
    letter-spacing: -0.58px;
    font-size: 15px;
    font-weight: 600;
    color: #0e0e12;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 14px 40px rgba(255,140,90,0.30), inset 0 1px 0 rgba(255,255,255,0.4);
    white-space: nowrap;
  }
  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 20px 50px rgba(255,140,90,0.42), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .cta:active{ transform: translateY(0); }
  .cta svg{
    width: 16px;
    height: 16px;
    transition: transform 0.25s ease;
  }
  .cta:hover svg{ transform: translateX(3px); }

  .footer{
    position: relative;
    z-index: 1;
    width: 100%;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.2px;
    padding: 0 24px 20px;
    margin-top: -56px;
  }
  .footer a{
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.25s ease, opacity 0.25s ease;
  }
  .footer a:hover{
    color: var(--accent-2);
    opacity: 0.9;
  }

  @media (max-width: 720px){
    html, body{
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .hero{
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 4px 18px 20px;
      gap: 20px;
    }
    h1{ letter-spacing: -1.4px; }

    .actions-row{
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .step{
      width: 100%;
    }
    .cta{
      width: 100%;
      height: 52px;
      font-size: 15px;
    }

    .footer{
      margin-top: 0;
      padding-bottom: 24px;
    }
  }
</style>
</head>
<body>

<main class="hero">

  <div class="eyebrow">Conversation wheel</div>

  <h1>Spin the <span>Conversation</span></h1>

  <p class="lead">
    Uma roleta de temas para aulas de conversação em inglês com 3 níveis.
    Gire, sorteie uma pergunta e treine a fala.
  </p>

  <div class="actions-row">
    <div class="step">
      <div class="step-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v4"/>
          <path d="M12 17v4"/>
          <path d="M3 12h4"/>
          <path d="M17 12h4"/>
        </svg>
      </div>
      <div class="step-title">Gire a roleta</div>
    </div>

    <div class="step">
      <div class="step-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="step-title">Leia o tema</div>
    </div>

    <div class="step">
      <div class="step-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
      </div>
      <div class="step-title">Fale 1 minuto</div>
    </div>

    <a class="cta" id="cta" href="select/">
      Começar
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14"/>
        <path d="M13 6l6 6-6 6"/>
      </svg>
    </a>
  </div>

</main>

<footer class="footer">
  desenvolvido por <a href="https://www.instagram.com/dicarvalho.prof/" target="_blank" rel="noopener noreferrer">@dicarvalho.prof</a> | <a href="https://wa.me/5516993272278" target="_blank" rel="noopener noreferrer">Seja aluno</a>
</footer>

<script>
const START_AUDIO_URL = "https://res.cloudinary.com/dbwqwgbtx/video/upload/v1793834548/freesound_community-camera-manual-click-39929_ebukss.mp3";

const cta = document.getElementById("cta");
const hasRealUrl = (u) => u && !u.startsWith("COLE_AQUI");

const audioStart = new Audio();
audioStart.src = hasRealUrl(START_AUDIO_URL) ? START_AUDIO_URL : "";
audioStart.preload = "auto";
audioStart.volume = 0.5;

let navigating = false;

cta.addEventListener("click", (e) => {
  if (navigating) {
    e.preventDefault();
    return;
  }

  if (!hasRealUrl(START_AUDIO_URL)) return;

  e.preventDefault();
  navigating = true;

  let navigated = false;
  const goToGame = () => {
    if (navigated) return;
    navigated = true;
    window.location.href = cta.getAttribute("href");
  };

  const safetyTimer = setTimeout(goToGame, 400);

  try {
    audioStart.currentTime = 0;
    const playPromise = audioStart.play();

    if (playPromise && playPromise.then) {
      playPromise
        .then(() => {
          setTimeout(() => {
            clearTimeout(safetyTimer);
            goToGame();
          }, 200);
        })
        .catch(() => {
          clearTimeout(safetyTimer);
          goToGame();
        });
    } else {
      setTimeout(() => {
        clearTimeout(safetyTimer);
        goToGame();
      }, 200);
    }
  } catch (err) {
    clearTimeout(safetyTimer);
    goToGame();
  }
});

// CORREÇÃO BUG 1: Reseta a variável se o usuário voltar pelo botão do navegador
window.addEventListener("pageshow", (e) => {
  if (e.persisted || (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]?.type === "back_forward")) {
    navigating = false;
  }
});
</script>
</body>
</html>
